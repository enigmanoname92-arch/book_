<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Իմ թվային գիրքը</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #332b25;
      --muted: #76695f;
      --accent: #76513c;
      --paper: #fffaf0;
      --paper-edge: #e9ddc8;
      --desk: #29352f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(ellipse at center, #526055 0, var(--desk) 70%);
      font-family: Georgia, "Noto Serif Armenian", serif;
    }
    button, input, select { font: inherit; }
    button {
      border: 1px solid #c9b49b;
      border-radius: 7px;
      padding: 8px 12px;
      color: #43372d;
      background: #fffaf0;
      cursor: pointer;
      transition: background .16s, transform .16s;
    }
    button:hover { background: #f2e7d5; }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .48; cursor: not-allowed; }
    .app { max-width: 1320px; margin: auto; padding: 18px 22px 24px; }
    .topbar, .toolbar, .bottom-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
    }
    .topbar { justify-content: space-between; margin: 0 auto 14px; color: #fff8e8; }
    .topbar h1 { margin: 0; font-size: clamp(20px, 3vw, 28px); font-weight: 500; }
    .top-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .top-actions button { font-size: 14px; }
    .toolbar { margin: 0 auto 14px; }
    .toolbar select { max-width: min(380px, 55vw); }
    select, input[type="text"], input[type="number"] {
      border: 1px solid #c9b49b;
      border-radius: 7px;
      padding: 8px 10px;
      color: var(--ink);
      background: #fffaf0;
    }
    .save-state { min-width: 92px; color: #eee4d2; font-size: 13px; text-align: center; }
    .book {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      width: min(1100px, 100%);
      min-height: min(70vh, 720px);
      margin: auto;
      perspective: 1900px;
      filter: drop-shadow(0 24px 24px #10191480);
    }
    .book::before {
      position: absolute;
      z-index: 4;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 30px;
      content: "";
      transform: translateX(-50%);
      background: linear-gradient(90deg, #6d543d33, #fff8e566 44%, #57432e55);
      pointer-events: none;
    }
    .page {
      position: relative;
      min-width: 0;
      min-height: 620px;
      padding: 28px clamp(20px, 4vw, 48px) 54px;
      overflow: auto;
      background:
        repeating-linear-gradient(0deg, transparent 0 31px, #bda98b15 32px),
        var(--paper);
      box-shadow: inset 0 0 25px #8c715126, inset 0 0 0 1px #d7c6aa;
    }
    .page:first-child { border-radius: 8px 0 0 8px; box-shadow: inset -12px 0 18px -18px #3d2b1a, inset 0 0 0 1px #d7c6aa; }
    .page:last-child { border-radius: 0 8px 8px 0; box-shadow: inset 12px 0 18px -18px #3d2b1a, inset 0 0 0 1px #d7c6aa; }
    .page:focus-visible { outline: 3px solid #c59b65; outline-offset: -4px; }
    .page-title {
      display: block;
      width: 100%;
      margin: 0 0 18px;
      padding: 0 0 10px;
      border: 0;
      border-bottom: 1px solid #d8c9b2;
      border-radius: 0;
      outline: 0;
      background: transparent;
      font-size: 19px;
      font-weight: bold;
    }
    .page-title::placeholder { color: #a69783; font-weight: normal; }
    .page-body { min-height: 460px; line-height: 1.75; overflow-wrap: anywhere; }
    .page-body:empty::before { color: #ac9e8a; content: "Սեղմեք էջի վրա՝ բովանդակություն ավելացնելու համար…"; pointer-events: none; }
    body:not(.author-mode) .page-body:empty::before { content: "Այս էջը դեռ դատարկ է։"; }
    .page-body.editing { outline: 1px dashed #c2a883; outline-offset: 5px; }
    .page-body img { display: block; max-width: 100%; }
    .page-number {
      position: absolute;
      bottom: 15px;
      left: 0;
      width: 100%;
      color: #897963;
      font-size: 13px;
      text-align: center;
    }
    .image-item { position: relative; width: 100%; max-width: 100%; margin: 14px 0; }
    .image-item img { width: 100%; height: auto; border-radius: 3px; cursor: grab; user-select: none; }
    .image-item.dragging img { cursor: grabbing; }
    .image-item .delete-item { position: absolute; z-index: 2; top: 5px; right: 5px; padding: 4px 8px; }
    .resize-handle {
      position: absolute;
      right: 2px;
      bottom: 2px;
      width: 18px;
      height: 18px;
      border: 2px solid white;
      border-radius: 4px;
      background: #76513c;
      cursor: nwse-resize;
    }
    .file-card {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0;
      padding: 12px;
      border: 1px solid #ddceb9;
      border-radius: 9px;
      background: #fffdf7c9;
    }
    .file-icon { font-size: 25px; }
    .file-info { min-width: 0; flex: 1; }
    .file-name { overflow-wrap: anywhere; font-weight: bold; }
    .file-size { color: var(--muted); font-size: 12px; }
    .file-card button { padding: 6px 9px; white-space: nowrap; }
    .media-item { margin: 14px 0; }
    .media-item audio, .media-item video { width: 100%; max-height: 350px; }
    .pdf-frame {
      margin: 16px 0;
      overflow: hidden;
      border: 1px solid #d5c4a8;
      border-radius: 8px;
      background: #f3eadb;
      box-shadow: 0 5px 14px #604b3226, inset 0 0 0 3px #fffaf0;
    }
    .pdf-title {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 6px 12px;
      border-bottom: 1px solid #dfd0b9;
      color: #76695f;
      background: linear-gradient(180deg, #fffdf8, #f5edde);
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    .pdf-title::before { content: "▤"; color: #9b7154; font-size: 15px; }
    .pdf-item {
      display: block;
      width: 100%;
      height: 460px;
      border: 0;
      background: var(--paper);
    }
    .element-caption { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .bottom-nav { min-height: 54px; margin-top: 13px; color: #fff8e8; }
    .bottom-nav .count { min-width: 110px; text-align: center; font-size: 15px; }
    .turning { transform-style: preserve-3d; }
    .turn-forward { transform-origin: left center; animation: turnForward .48s ease-in-out; }
    .turn-backward { transform-origin: right center; animation: turnBackward .48s ease-in-out; }
    @keyframes turnForward { 0% { transform: rotateY(0); } 48% { transform: rotateY(-82deg); } 100% { transform: rotateY(0); } }
    @keyframes turnBackward { 0% { transform: rotateY(0); } 48% { transform: rotateY(82deg); } 100% { transform: rotateY(0); } }
    .modal-backdrop {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: #101712a8;
    }
    .modal {
      width: min(440px, 100%);
      padding: 22px;
      border: 1px solid #d9c7ac;
      border-radius: 13px;
      background: #fffaf0;
      box-shadow: 0 18px 60px #0005;
    }
    .modal h2 { margin: 0 0 14px; font-size: 21px; }
    .modal p { color: var(--muted); line-height: 1.55; }
    .modal-options { display: grid; gap: 9px; }
    .modal-options button { text-align: left; }
    .modal-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .editor-tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
    .editor-tools button { padding: 5px 9px; }
    .status-message {
      position: fixed;
      z-index: 20;
      right: 18px;
      bottom: 18px;
      max-width: min(420px, calc(100vw - 36px));
      padding: 12px 16px;
      border-radius: 8px;
      color: white;
      background: #263b31;
      box-shadow: 0 5px 22px #0004;
    }
    .status-message.error { background: #8c352f; }
    .admin-entry {
      position: fixed;
      z-index: 5;
      right: 3px;
      bottom: 3px;
      width: 18px;
      height: 18px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      opacity: .035;
      background: #fffaf0;
    }
    .admin-entry:hover, .admin-entry:focus-visible { opacity: .8; }
    body:not(.author-mode) #addPageBtn,
    body:not(.author-mode) #deletePageBtn,
    body:not(.author-mode) #movePageBtn,
    body:not(.author-mode) #exportBtn,
    body:not(.author-mode) #importBtn,
    body:not(.author-mode) #saveState { display: none !important; }
    body:not(.author-mode) .delete-item,
    body:not(.author-mode) .resize-handle,
    body:not(.author-mode) .editor-tools,
    body:not(.author-mode) .editable-text { display: none !important; }
    .page-title-display {
      display: block;
      min-height: 31px;
      width: 100%;
      margin: 0 0 18px;
      padding: 0 0 10px;
      border-bottom: 1px solid #d8c9b2;
      font-size: 19px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }
    .author-exit { font-size: 13px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 700px) {
      .app { padding: 12px 12px 20px; }
      .topbar { align-items: flex-start; gap: 10px; }
      .topbar h1 { padding-top: 5px; }
      .top-actions { justify-content: flex-end; max-width: 62%; }
      .top-actions button { padding: 7px 9px; font-size: 12px; }
      .toolbar { gap: 6px; }
      .toolbar button, .toolbar select { padding: 7px 8px; font-size: 13px; }
      .book { display: block; min-height: 72vh; }
      .book::before { display: none; }
      .page { display: none; min-height: 72vh; padding: 22px 22px 48px; border-radius: 8px !important; }
      .page.active { display: block; }
      .page-body { min-height: 55vh; }
      .page-number { bottom: 12px; }
      .bottom-nav { gap: 7px; }
      .bottom-nav button { padding: 7px 9px; font-size: 13px; }
    }
    @media print {
      body { background: white; }
      .app { max-width: none; padding: 0; }
      .topbar, .toolbar, .bottom-nav, .modal-backdrop, .status-message, .delete-item, .resize-handle { display: none !important; }
      .book { display: block; width: 100%; filter: none; page-break-after: always; }
      .book::before { display: none; }
      .page, .page.active { display: block !important; min-height: 0; height: auto; overflow: visible; border: 0; border-radius: 0; box-shadow: none !important; page-break-after: always; }
      .page-body { min-height: 0; }
      .pdf-item { height: 650px; }
      .image-item img { max-height: 650px; object-fit: contain; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>📖 Իմ թվային գիրքը</h1>
      <div class="top-actions">
        <button id="exportBtn" type="button">Արտահանել գիրքը</button>
        <button id="importBtn" type="button">Ներմուծել գիրքը</button>
        <button id="printBtn" type="button">Տպել / Պահպանել PDF</button>
      </div>
    </header>
    <nav class="toolbar" aria-label="Գրքի կառավարում">
      <label class="visually-hidden" for="toc">Բովանդակության ցանկ</label>
      <select id="toc" title="Բովանդակության ցանկ">
        <option value="">Բովանդակության ցանկ</option>
      </select>
      <button id="addPageBtn" type="button">＋ Ավելացնել նոր էջ</button>
      <button id="deletePageBtn" type="button">Ջնջել էջը</button>
      <button id="movePageBtn" type="button">Տեղափոխել էջը</button>
      <span id="saveState" class="save-state" role="status">Բեռնվում է…</span>
      <button id="authorExitBtn" class="author-exit" type="button" hidden>Փակել հեղինակի ռեժիմը</button>
    </nav>
    <section id="book" class="book" aria-label="Թվային գիրք"></section>
    <nav class="bottom-nav" aria-label="Էջերի համարակալում">
      <button id="previousBtn" type="button" aria-label="Նախորդ էջ">← Նախորդ</button>
      <span id="pageCount" class="count"></span>
      <button id="nextBtn" type="button" aria-label="Հաջորդ էջ">Հաջորդ →</button>
    </nav>
  </main>
  <input id="fileInput" type="file" hidden>
  <input id="importInput" type="file" accept=".json,.html,.htm,application/json,text/html" hidden>
  <button id="adminEntry" class="admin-entry" type="button" aria-label="Հեղինակի մուտք" title="Հեղինակի մուտք"></button>
  <div id="modalRoot"></div>
  <div id="statusRoot" aria-live="polite"></div>
  <script>
    "use strict";
    (() => {
      const DB_NAME = "digital-book-hy";
      const DB_VERSION = 1;
      const STORE_NAME = "books";
      const BOOK_KEY = "main-book";
      const MAX_FILE_SIZE = 15 * 1024 * 1024;
      const MAX_TOTAL_SIZE = 100 * 1024 * 1024;
      // Փոխարինեք ձեր գաղտնաբառի SHA-256 հեշով (64 տասնվեցական նիշ)։
      const ADMIN_PASSWORD_SHA256 = "a320480f534776bddb5cdb54b1e93d210a3c7d199e80a23c1b2178497b184c76";
      const bookElement = document.getElementById("book");
      const toc = document.getElementById("toc");
      const saveState = document.getElementById("saveState");
      const fileInput = document.getElementById("fileInput");
      const importInput = document.getElementById("importInput");
      const modalRoot = document.getElementById("modalRoot");
      const statusRoot = document.getElementById("statusRoot");
      let book = { pages: [] };
      let currentPage = 0;
      let db;
      let saveTimer;
      let currentUploadPage = null;
      let textEditing = false;
      let isAuthor = false;
      let adminDialogOpen = false;

      function setAuthorMode(enabled) {
        isAuthor = enabled;
        document.body.classList.toggle("author-mode", enabled);
        document.getElementById("authorExitBtn").hidden = !enabled;
        render();
      }
      async function sha256Hex(value) {
        if (!window.crypto || !crypto.subtle || !window.TextEncoder) {
          throw new Error("Գաղտնաբառի SHA-256 ստուգման համար օգտագործեք թարմ դիտարկիչ կամ Live Server։");
        }
        const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(value));
        return [...new Uint8Array(digest)].map((byte) => byte.toString(16).padStart(2, "0")).join("");
      }
      function requestAuthorMode() {
        if (isAuthor || adminDialogOpen) return;
        if (!/^[a-f0-9]{64}$/i.test(ADMIN_PASSWORD_SHA256)) {
          notify("Սկզբում կոդում սահմանեք ADMIN_PASSWORD_SHA256-ի 64-նիշ SHA-256 հեշը։", true);
          return;
        }
        adminDialogOpen = true;
        const form = document.createElement("form");
        form.id = "authorLoginForm";
        const label = document.createElement("label");
        label.textContent = "Հեղինակի գաղտնաբառ";
        const input = document.createElement("input");
        input.type = "password";
        input.autocomplete = "current-password";
        input.required = true;
        input.style.width = "100%";
        input.style.marginTop = "8px";
        label.append(input);
        form.append(label);
        const unlock = document.createElement("button");
        unlock.type = "submit";
        unlock.setAttribute("form", form.id);
        unlock.textContent = "Մուտք գործել";
        const backdrop = showModal("Հեղինակի մուտք", form, [unlock]);
        const observer = new MutationObserver(() => {
          if (!backdrop.isConnected) {
            adminDialogOpen = false;
            observer.disconnect();
          }
        });
        observer.observe(modalRoot, { childList: true });
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          unlock.disabled = true;
          try {
            const enteredHash = await sha256Hex(input.value);
            if (enteredHash !== ADMIN_PASSWORD_SHA256.toLowerCase()) {
              input.value = "";
              input.setCustomValidity("Գաղտնաբառը սխալ է։");
              input.reportValidity();
              input.setCustomValidity("");
              return;
            }
            backdrop.remove();
            adminDialogOpen = false;
            setAuthorMode(true);
            if (location.hash === "#admin") history.replaceState(null, "", location.pathname + location.search);
            notify("Հեղինակի ռեժիմը միացված է։");
          } catch (error) {
            notify(error.message || "Գաղտնաբառը ստուգել չհաջողվեց։", true);
          } finally {
            unlock.disabled = false;
          }
        });
        input.focus();
      }

      const newPage = () => ({ id: makeId(), title: "", elements: [] });
      function makeId() {
        return (typeof crypto !== "undefined" && crypto.randomUUID)
          ? crypto.randomUUID()
          : Date.now().toString(36) + Math.random().toString(36).slice(2);
      }
      function openDatabase() {
        return new Promise((resolve, reject) => {
          if (!("indexedDB" in window)) {
            reject(new Error("Այս դիտարկիչում IndexedDB-ը հասանելի չէ։"));
            return;
          }
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = () => {
            const database = request.result;
            if (!database.objectStoreNames.contains(STORE_NAME)) database.createObjectStore(STORE_NAME);
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error("Չհաջողվեց բացել IndexedDB-ը։"));
        });
      }
      function readBook() {
        return new Promise((resolve, reject) => {
          const request = db.transaction(STORE_NAME, "readonly").objectStore(STORE_NAME).get(BOOK_KEY);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error("Չհաջողվեց կարդալ պահված գիրքը։"));
        });
      }
      function persistBook() {
        return new Promise((resolve, reject) => {
          const transaction = db.transaction(STORE_NAME, "readwrite");
          transaction.objectStore(STORE_NAME).put(book, BOOK_KEY);
          transaction.oncomplete = resolve;
          transaction.onerror = () => reject(transaction.error || new Error("Չհաջողվեց պահպանել գիրքը։"));
          transaction.onabort = () => reject(transaction.error || new Error("Գրքի պահպանումը չեղարկվեց։"));
        });
      }
      function scheduleSave() {
        if (!db) return;
        clearTimeout(saveTimer);
        saveState.textContent = "Պահպանում…";
        saveTimer = setTimeout(async () => {
          try {
            await persistBook();
            saveState.textContent = "Պահպանված է";
          } catch (error) {
            saveState.textContent = "Չպահպանվեց";
            notify(error.message || "Գիրքը չհաջողվեց պահպանել։", true);
          }
        }, 300);
      }
      function notify(message, isError = false) {
        statusRoot.replaceChildren();
        const box = document.createElement("div");
        box.className = "status-message" + (isError ? " error" : "");
        box.textContent = message;
        statusRoot.append(box);
        setTimeout(() => box.remove(), 4500);
      }
      function current() { return book.pages[currentPage]; }
      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[char]);
      }
      function sanitizeHtml(html) {
        const parsed = new DOMParser().parseFromString(String(html), "text/html");
        const allowed = new Set(["B", "STRONG", "I", "EM", "U", "P", "BR", "H1", "H2", "H3", "UL", "OL", "LI", "BLOCKQUOTE", "SPAN"]);
        const cleanNode = (node) => {
          [...node.childNodes].forEach((child) => {
            if (child.nodeType === Node.ELEMENT_NODE) {
              if (!allowed.has(child.tagName)) {
                child.replaceWith(...child.childNodes);
                return;
              }
              [...child.attributes].forEach((attribute) => {
                if (child.tagName !== "SPAN" || attribute.name !== "style" || !/^font-size:\s*(?:[1-7]|[1-9][0-9]?)(?:px|pt|em|rem);?$/i.test(attribute.value.trim())) {
                  child.removeAttribute(attribute.name);
                }
              });
              cleanNode(child);
            } else if (child.nodeType !== Node.TEXT_NODE) child.remove();
          });
        };
        cleanNode(parsed.body);
        return parsed.body.innerHTML;
      }
      function formatSize(bytes) {
        if (bytes < 1024) return bytes + " բայթ";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " ԿԲ";
        return (bytes / 1024 / 1024).toFixed(1) + " ՄԲ";
      }
      function fileKind(file) {
        const type = (file.type || "").toLowerCase();
        const name = file.name.toLowerCase();

    h1{margin:0;font-size:clamp(20px,3vw,28px);font-weight:500}
    .toolbar{margin:0 auto 14px}.toolbar select{max-width:min(380px,55vw)}
    .book{position:relative;width:min(1100px,100%);min-height:min(70vh,720px);margin:auto;perspective:1900px;filter:drop-shadow(0 24px 24px #10191480)}
    .book:before{position:absolute;z-index:4;top:0;bottom:0;left:50%;width:30px;content:"";transform:translateX(-50%);background:linear-gradient(90deg,#6d543d33,#fff8e566 44%,#57432e55);pointer-events:none}
    .spread{display:none;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:min(70vh,720px)}
    .spread.active{display:grid}
    .page{position:relative;min-width:0;min-height:620px;padding:28px clamp(20px,4vw,48px) 54px;overflow:auto;background:repeating-linear-gradient(0deg,transparent 0 31px,#bda98b15 32px),var(--paper);box-shadow:inset 0 0 25px #8c715126,inset 0 0 0 1px #d7c6aa}
    .page:first-child{border-radius:8px 0 0 8px;box-shadow:inset -12px 0 18px -18px #3d2b1a,inset 0 0 0 1px #d7c6aa}
    .page:last-child{border-radius:0 8px 8px 0;box-shadow:inset 12px 0 18px -18px #3d2b1a,inset 0 0 0 1px #d7c6aa}
    .page-title-display{min-height:31px;width:100%;margin:0 0 18px;padding:0 0 10px;border-bottom:1px solid #d8c9b2;font-size:19px;font-weight:bold;overflow-wrap:anywhere}
    .page-body{min-height:460px;overflow-wrap:anywhere}.page-body img{display:block;max-width:100%}
    .page-number{position:absolute;bottom:15px;left:0;width:100%;color:#897963;font-size:13px;text-align:center}
    .empty-hint{color:#ac9e8a}.image-item{position:relative;max-width:100%;margin:14px 0}
    .image-item img{width:100%;height:auto;border-radius:3px}
    .media-item{margin:14px 0}.media-item audio,.media-item video{width:100%;max-height:350px}
    .pdf-frame{margin:16px 0;overflow:hidden;border:1px solid #d5c4a8;border-radius:8px;background:#f3eadb;box-shadow:0 5px 14px #604b3226,inset 0 0 0 3px #fffaf0}
    .pdf-title{display:flex;align-items:center;gap:8px;min-height:34px;padding:6px 12px;border-bottom:1px solid #dfd0b9;color:#76695f;background:linear-gradient(180deg,#fffdf8,#f5edde);font-size:12px;overflow-wrap:anywhere}
    .pdf-title:before{content:"▤";color:#9b7154;font-size:15px}
    .pdf-item{display:block;width:100%;height:460px;border:0;background:var(--paper)}
    .file-card{display:flex;align-items:center;gap:12px;margin:12px 0;padding:12px;border:1px solid #ddceb9;border-radius:9px;background:#fffdf7c9}
    .file-icon{font-size:25px}.file-info{min-width:0;flex:1}.file-name{overflow-wrap:anywhere;font-weight:bold}.file-size{color:var(--muted);font-size:12px}
    .download-link{padding:6px 9px;border:1px solid #c9b49b;border-radius:7px;color:#43372d;background:#fffaf0;text-decoration:none;white-space:nowrap}
    .bottom-nav{min-height:54px;margin-top:13px;color:#fff8e8}.count{min-width:130px;text-align:center;font-size:15px}
    .turning{transform-style:preserve-3d}.turn-forward{transform-origin:left center;animation:turnForward .48s ease-in-out}.turn-backward{transform-origin:right center;animation:turnBackward .48s ease-in-out}
    @keyframes turnForward{0%{transform:rotateY(0)}48%{transform:rotateY(-82deg)}100%{transform:rotateY(0)}}
    @keyframes turnBackward{0%{transform:rotateY(0)}48%{transform:rotateY(82deg)}100%{transform:rotateY(0)}}
    @media(max-width:700px){.app{padding:12px 12px 20px}.topbar{align-items:flex-start;gap:10px}.book{min-height:72vh}.book:before{display:none}.spread,.spread.active{display:block;min-height:72vh}.page{display:none;min-height:72vh;padding:22px 22px 48px;border-radius:8px!important}.page.active{display:block}.blank-page{display:none!important}.page-body{min-height:55vh}.page-number{bottom:12px}.bottom-nav{gap:7px}.bottom-nav button,.toolbar button,.toolbar select{padding:7px 9px;font-size:13px}}
    @media print{body{background:#fff}.app{max-width:none;padding:0}.topbar,.toolbar,.bottom-nav{display:none!important}.book{display:block;width:100%;filter:none}.book:before{display:none}.spread,.spread.active{display:grid!important;min-height:0;height:auto;page-break-after:always}.page,.page.active{display:block!important;min-height:0;height:auto;overflow:visible;border:0;border-radius:0;box-shadow:none!important;page-break-after:avoid}.page-body{min-height:0}.pdf-item{height:650px}.image-item img{max-height:650px;object-fit:contain}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><h1>📖 Իմ թվային գիրքը</h1></header>
    <nav class="toolbar" aria-label="Բովանդակության ցանկ">
      <label class="visually-hidden" for="toc">Բովանդակության ցանկ</label>
      <select id="toc" title="Բովանդակության ցանկ"><option value="">Բովանդակության ցանկ</option>${tocOptions}</select>
    </nav>
    <section id="book" class="book" aria-label="Թվային գիրք">${spreads.join("\n")}</section>
    <nav class="bottom-nav" aria-label="Էջերի համարակալում">
      <button id="previousBtn" type="button" aria-label="Նախորդ էջ">← Նախորդ</button>
      <span id="pageCount" class="count"></span>
      <button id="nextBtn" type="button" aria-label="Հաջորդ էջ">Հաջորդ →</button>
    </nav>
  </main>
  <script id="book-data" type="application/json">${json}<\/script>
  <script>
    (()=>{"use strict";
      const pages=JSON.parse(document.getElementById("book-data").textContent).pages;
      const spreads=[...document.querySelectorAll(".spread")];
      const toc=document.getElementById("toc");
      const count=document.getElementById("pageCount");
      let currentPage=0;
      const mobile=()=>matchMedia("(max-width:700px)").matches;
      function render(){
        const spreadIndex=mobile()?Math.floor(currentPage/2):Math.floor(currentPage/2);
        spreads.forEach((spread,index)=>spread.classList.toggle("active",index===spreadIndex));
        document.querySelectorAll(".page[data-page-index]").forEach(page=>page.classList.toggle("active",Number(page.dataset.pageIndex)===currentPage));
        toc.value=String(currentPage);
        count.textContent=mobile()?("Էջ "+(currentPage+1)+" / "+pages.length):("Էջ "+(currentPage+1)+(currentPage+1<pages.length?"–"+(currentPage+2):"")+" / "+pages.length);
        document.getElementById("previousBtn").disabled=currentPage===0;
        document.getElementById("nextBtn").disabled=mobile()?currentPage>=pages.length-1:currentPage>=pages.length-2;
      }
      function goTo(index,direction){
        if(index<0||index>=pages.length||index===currentPage)return;
        const active=document.querySelector(".spread.active");
        active.classList.add("turning",direction>0?"turn-forward":"turn-backward");
        setTimeout(()=>{currentPage=index;render()},240);
      }
      function turn(direction){
        const step=mobile()||currentPage%2===1?1:2;
        goTo(currentPage+Math.sign(direction)*step,direction);
      }
      document.getElementById("previousBtn").addEventListener("click",()=>turn(-1));
      document.getElementById("nextBtn").addEventListener("click",()=>turn(1));
      toc.addEventListener("change",()=>{if(toc.value!==""){const target=Number(toc.value);goTo(target,target>currentPage?1:-1)}});
      document.addEventListener("keydown",event=>{
        if(["INPUT","SELECT","TEXTAREA"].includes(event.target.tagName))return;
        if(event.key==="ArrowRight")turn(1);
        else if(event.key==="ArrowLeft")turn(-1);
      });
      window.addEventListener("resize",render);
      render();
    })();
  <\/script>
</body>
</html>`;
          const url = URL.createObjectURL(new Blob([html], { type: "text/html;charset=utf-8" }));
          const link = document.createElement("a");
          link.href = url;
          link.download = "իմ-թվային-գիրքը.html";
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 30000);
          notify("Գիրքը արտահանվեց HTML ֆայլով։");
        } catch (error) {
          notify("Արտահանումը չհաջողվեց․ " + (error.message || "անհայտ սխալ"), true);
        }
      }
      async function importBookFile(file) {
        if (!isAuthor) return;
        if (!file) return;
        try {
          const content = await file.text();
          let data;
          if (/\.html?$/i.test(file.name) || content.includes('id="book-data"')) {
            const document = new DOMParser().parseFromString(content, "text/html");
            const payload = document.getElementById("book-data");
            if (!payload) throw new Error("HTML ֆայլում գրքի ներմուծման տվյալներ չկան։");
            data = JSON.parse(payload.textContent);
          } else data = JSON.parse(content);
          if (!data || !Array.isArray(data.pages) || data.pages.length === 0) throw new Error("Ֆայլի կառուցվածքը գրքի վավեր տվյալներ չի պարունակում։");
          let total = 0;
          const pages = data.pages.map((page) => {
            if (!page || !Array.isArray(page.elements)) throw new Error("Գրքի էջերից մեկի տվյալները վնասված են։");
            const elements = page.elements.map((item) => {
              if (!item || typeof item.type !== "string") throw new Error("Գրքի տարրի տվյալները վնասված են։");
              if (item.type === "text") return { id: item.id || makeId(), type: "text", html: sanitizeHtml(item.html || "") };
              const allowedTypes = new Set(["image", "pdf", "audio", "video", "file"]);
              if (!allowedTypes.has(item.type)) throw new Error("Գրքի ֆայլի ձևաչափը չի աջակցվում։");
              const blob = item.data ? base64ToBlob(item.data, item.mime) : item.blob;
              if (!(blob instanceof Blob)) throw new Error(`«${item.name || "Անանուն"}» ֆայլի տվյալները բացակայում են։`);
              total += blob.size;
              if (blob.size > MAX_FILE_SIZE || total > MAX_TOTAL_SIZE) throw new Error("Ներմուծվող գիրքը գերազանցում է թույլատրված ֆայլի կամ ընդհանուր չափը։");
              return { id: item.id || makeId(), type: item.type, name: String(item.name || "Ֆայլ"), mime: String(item.mime || blob.type || "application/octet-stream"), size: blob.size, blob, width: Math.max(15, Math.min(100, Number(item.width) || 100)), x: Number(item.x) || 0, y: Number(item.y) || 0 };
            });
            return { id: page.id || makeId(), title: String(page.title || ""), elements };
          });
          clearTimeout(saveTimer);
          book = { pages };
          currentPage = 0;
          render();
          await persistBook();
          saveState.textContent = "Պահպանված է";
          notify("Գիրքը ներմուծվեց և պահպանվեց։");
        } catch (error) {
          notify("Ներմուծումը չհաջողվեց․ " + (error.message || "ֆայլը սխալ է"), true);
        }
      }

      document.getElementById("previousBtn").addEventListener("click", () => moveBy(-1));
      document.getElementById("nextBtn").addEventListener("click", () => moveBy(1));
      document.getElementById("addPageBtn").addEventListener("click", addPage);
      document.getElementById("deletePageBtn").addEventListener("click", deletePage);
      document.getElementById("movePageBtn").addEventListener("click", movePage);
      document.getElementById("exportBtn").addEventListener("click", exportBook);
      document.getElementById("importBtn").addEventListener("click", () => { if (isAuthor) importInput.click(); });
      document.getElementById("printBtn").addEventListener("click", () => window.print());
      document.getElementById("adminEntry").addEventListener("click", requestAuthorMode);
      document.getElementById("authorExitBtn").addEventListener("click", () => {
        textEditing = false;
        setAuthorMode(false);
        notify("Ընթերցողի ռեժիմը միացված է։");
      });
      window.addEventListener("hashchange", () => {
        if (location.hash === "#admin") requestAuthorMode();
      });
      toc.addEventListener("change", () => {
        if (toc.value !== "") flipTo(Number(toc.value), Number(toc.value) > currentPage ? "next" : "previous");
      });
      fileInput.addEventListener("change", () => {
        if (currentUploadPage !== null) addFiles([...fileInput.files], currentUploadPage);
        fileInput.value = "";
      });
      importInput.addEventListener("change", () => {
        importBookFile(importInput.files[0]);
        importInput.value = "";
      });
      document.addEventListener("keydown", (event) => {
        if (event.target.isContentEditable || ["INPUT", "TEXTAREA", "SELECT"].includes(event.target.tagName) || modalRoot.childElementCount) return;
        if (event.key === "ArrowRight") moveBy(1);
        else if (event.key === "ArrowLeft") moveBy(-1);
      });
      window.addEventListener("resize", render);

      (async () => {
        try {
          db = await openDatabase();
          const stored = await readBook();
          if (stored && Array.isArray(stored.pages) && stored.pages.length) book = stored;
          else book = { pages: Array.from({ length: 20 }, newPage) };
          render();
          saveState.textContent = "Պահպանված է";
          if (!stored) await persistBook();
          if (location.hash === "#admin") requestAuthorMode();
        } catch (error) {
          saveState.textContent = "Պահպանումը հասանելի չէ";
          notify(error.message || "Գիրքը բեռնել չհաջողվեց։", true);
          if (!book.pages.length) book.pages = Array.from({ length: 20 }, newPage);
          render();
        }
      })();
    })();
  </script>
</body>
